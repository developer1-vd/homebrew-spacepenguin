# Installs the cask with Homebrew on real Macs (GitHub's macOS runners), starts
# SpacePenguin, takes a screenshot of it, and removes it again: a test of the
# cask and the Mac app without owning a Mac. Runs on every push and pull request,
# and by hand from the Actions tab.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cask:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Homebrew asks GitHub's API about releases; without a token, GitHub's shared
      # Mac runners soon run into its limit of 60 requests an hour.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 Sequoia
            os: macos-15
          - name: macOS 26 Tahoe
            os: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tap this repository, and trust it
        run: |
          brew tap developer1-vd/spacepenguin "${GITHUB_WORKSPACE}"
          # Homebrew loads casks from other people's taps only once told to.
          brew trust developer1-vd/spacepenguin

      - name: Check the cask's style
        run: brew style --cask developer1-vd/spacepenguin/spacepenguin

      # Homebrew's own catalogue takes no pre-releases; this tap does, until 1.0.0.
      - name: Audit the cask (download and checksum included)
        run: |
          brew audit --cask --online --except=github_prerelease_version \
            developer1-vd/spacepenguin/spacepenguin

      - name: Livecheck finds the newest release
        run: brew livecheck --cask developer1-vd/spacepenguin/spacepenguin

      - name: Install
        run: brew install --cask developer1-vd/spacepenguin/spacepenguin

      - name: Start SpacePenguin and take a screenshot
        run: |
          app=/Applications/SpacePenguin.app
          test -d "${app}"
          defaults read "${app}/Contents/Info.plist" CFBundleShortVersionString
          "${app}/Contents/MacOS/SpacePenguin" --version
          # No setup wizard on an unattended run.
          SPACEPENGUIN_NO_SETUP=1 "${app}/Contents/MacOS/SpacePenguin" https://example.com/ &
          pid=$!
          sleep 40
          screencapture -x screenshot.png || true
          kill -0 "${pid}" || { echo "::error::SpacePenguin quit by itself"; exit 1; }
          kill "${pid}"
          wait "${pid}" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: screenshot.png
          if-no-files-found: ignore

      - name: Uninstall
        run: brew uninstall --cask --zap spacepenguin

  # The DMG on its own, the way people install it without Homebrew: download it,
  # open it, copy the app to Applications, start it.
  dmg:
    name: DMG on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 Sequoia
            os: macos-15
          - name: macOS 26 Tahoe
            os: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download the DMG the cask points to, and check it
        run: |
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/spacepenguin.rb)
          sha=$(sed -n 's/^  sha256 "\(.*\)"/\1/p' Casks/spacepenguin.rb)
          echo "SpacePenguin ${version}"
          curl -fsSLo SpacePenguin.dmg \
            "https://github.com/developer1-vd/SpacePenguin/releases/download/v${version}/SpacePenguin-${version}-macos.dmg"
          echo "${sha}  SpacePenguin.dmg" | shasum -a 256 -c

      - name: Open the DMG and copy the app to Applications
        run: |
          mount=$(hdiutil attach -nobrowse -readonly SpacePenguin.dmg | awk -F'\t' '/\/Volumes\// {print $NF}')
          ls -la "${mount}"
          test -d "${mount}/SpacePenguin.app"
          [ -L "${mount}/Applications" ] || echo "::warning::The DMG has no Applications shortcut to drag the app onto"
          ditto "${mount}/SpacePenguin.app" /Applications/SpacePenguin.app
          hdiutil detach "${mount}"
          lipo -archs /Applications/SpacePenguin.app/Contents/MacOS/SpacePenguin

      - name: What Gatekeeper says
        run: |
          spctl --assess --type execute -vv /Applications/SpacePenguin.app 2>&1 \
            || echo "::notice::Gatekeeper refuses SpacePenguin (not notarised): people need Open Anyway on the first start."

      - name: Start it as a double-click does, and take a screenshot
        run: |
          open --env SPACEPENGUIN_NO_SETUP=1 -a /Applications/SpacePenguin.app --args https://example.com/
          sleep 40
          screencapture -x screenshot.png || true
          pgrep -x SpacePenguin >/dev/null || { echo "::error::SpacePenguin is not running 40 seconds after it was opened"; exit 1; }
          # Quit as the menu's Quit does. Qt answers macOS's quit request with
          # "cancel" (-128) and then quits by itself, so osascript's answer means
          # nothing: what counts is that it is gone, without a crash report.
          osascript -e 'quit app "SpacePenguin"' || true
          for i in $(seq 1 20); do pgrep -x SpacePenguin >/dev/null || break; sleep 1; done
          if pgrep -x SpacePenguin >/dev/null; then
            echo "::error::SpacePenguin did not quit within 20 seconds of being asked"
            pkill -9 -x SpacePenguin
            exit 1
          fi
          sleep 3
          if ls ~/Library/Logs/DiagnosticReports/SpacePenguin* 2>/dev/null; then
            echo "::error::SpacePenguin crashed (crash report above)"
            head -c 4000 ~/Library/Logs/DiagnosticReports/SpacePenguin* || true
            exit 1
          fi
          echo "SpacePenguin quit cleanly."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-dmg-${{ matrix.os }}
          path: screenshot.png
          if-no-files-found: ignore
